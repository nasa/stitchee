# A reusable workflow to build and run the unit test suite
#
# This workflow will install Python dependencies, run tests,
# and report test results and code coverage as artifacts. It will
# be called by the workflow that run tests against new PRs and as
# a first step in the workflow that publishes new Docker images.
name: Unit Tests

on:
  workflow_call:
    secrets:
      codecov_token:
        required: true
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev --extra harmony

      - name: Run linting
        run: |
          uv run ruff check stitchee

      - name: Run tests and collect coverage
        run: uv run pytest --cov=stitchee --cov-report=xml tests/unit

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: unittests
