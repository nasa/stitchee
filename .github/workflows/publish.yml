name: Publish on Release

on:
  release:
    types: [published] # This ensures the workflow runs only after a release is finalized
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., v1.11.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    environment: pypi
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      venue: ${{ steps.version.outputs.venue }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0 # Fetch all history for accurate versioning/changelogs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-path: "pyproject.toml"

      - name: Extract version from git tag
        id: version
        run: |
          # Handle both release events and manual dispatch
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            # Manual dispatch
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"  # Strip 'v' prefix if present
          else
            # Release event: github.ref is like refs/tags/v1.11.0
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Determine venue based on version
          if [[ "$VERSION" =~ rc ]]; then
            VENUE=uat
          elif [[ "$VERSION" =~ a ]]; then
            VENUE=sit
          else
            VENUE=ops
          fi
          echo "venue=$VENUE" >> $GITHUB_OUTPUT

          echo "📦 Publishing version: $VERSION (venue: $VENUE)"

      - name: Verify version matches git tag
        run: scripts/verify_tag.sh

      - name: Install dependencies
        run: uv sync --extra harmony --frozen

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Update Snyk monitoring for production release
        uses: snyk/actions/python@master
        continue-on-error: true  # Don't block release if monitoring fails
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: >
            --org=${{ secrets.SNYK_ORG_ID }}
            --project-name=${{ github.repository }}
            --project-tags=release=${{ steps.version.outputs.version }},venue=${{ steps.version.outputs.venue }}

  # Build and push Docker image for releases
  docker:
    needs: build-and-publish
    uses: ./.github/workflows/docker-build.yml
    with:
      version: ${{ needs.build-and-publish.outputs.version }}
      venue: ${{ needs.build-and-publish.outputs.venue }}
      push: true
